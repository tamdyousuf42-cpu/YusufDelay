<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yusuf Delay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Yusuf Delay</h1>

    <label for="mic">Microphone</label>
    <select id="mic">
      <option value="mic1">Mic 1</option>
      <option value="mic2">Mic 2</option>
      <option value="both">Both Mics</option>
    </select>

    <label for="output">Audio Output</label>
    <select id="output">
      <option value="auto">Auto</option>
      <option value="phone">Phone Speaker</option>
      <option value="earphone">Earphone</option>
      <option value="bluetooth">Bluetooth Speaker</option>
    </select>

    <div id="delay-controls">
      <p>Delay & Echo Effects</p>
    </div>

    <script src="app.js"></script>
  </div>
</body>
</html>
